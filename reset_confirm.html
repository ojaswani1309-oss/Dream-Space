{% extends "base_auth.html" %}
{% block content %}
{% if validlink %}
<h2 class="center">Choose a new password</h2>
<form method="post" class="stack">{% csrf_token %}
  {% for f in form %}<label>{{ f.label }}{{ f }}{% for e in f.errors %}<small class="err">{{ e }}</small>{% endfor %}</label>{% endfor %}
  <button class="btn block">Save new password</button>
</form>
{% else %}
<div class="empty"><div class="empty-icon">🍂</div><h2>This link has expired</h2><p class="muted">Reset links can only be used once. Request a new one.</p>
<a class="btn" href="{% url 'forgot_password' %}">Request a new link</a></div>
{% endif %}{% endblock %}
