{% extends "base_auth.html" %}{% block title %}Log in · Dream Space{% endblock %}
{% block content %}
<form method="post" class="stack" novalidate>{% csrf_token %}
  {% if form.non_field_errors %}<div class="form-error">{{ form.non_field_errors.0 }}</div>{% endif %}
  <label>Email or username{{ form.username }}</label>
  <label>Password{{ form.password }}</label>
  <div class="row between"><label class="inline">{{ form.remember_me }} Remember me</label><a href="{% url 'forgot_password' %}">Forgot password?</a></div>
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn block">Log in</button>
</form>
<p class="center muted">New here? <a href="{% url 'signup' %}">Create your space</a></p>
{% endblock %}
