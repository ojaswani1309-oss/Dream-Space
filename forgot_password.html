{% extends "base_auth.html" %}{% block title %}Forgot password · Dream Space{% endblock %}
{% block content %}
<h2 class="center">Forgot your password?</h2>
<p class="muted center">Enter your email and we'll send you a link to set a new one.</p>
<form method="post" class="stack">{% csrf_token %}
  <label>Email<input type="email" name="email" class="input" placeholder="you@example.com" required autofocus></label>
  {% for e in form.email.errors %}<small class="err">{{ e }}</small>{% endfor %}
  <button class="btn block">Send reset link</button>
</form>
<p class="center"><a href="{% url 'login' %}">Back to log in</a></p>
{% endblock %}
